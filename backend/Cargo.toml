[workspace]
resolver = "3"
members = ["crates/api", "crates/worker", "crates/core", "crates/db"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

# Versions checked on crates.io on 2026-11-17. Add new crates here, then
# reference them from a member crate with `name.workspace = true`.
[workspace.dependencies]
yob-core = { path = "crates/core" }
yob-db = { path = "crates/db" }

ammonia = "4.2.5"
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1"] }
dotenvy = "0.15.7"
futures = "0.3.34"
html-escape = "0.3.1"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
