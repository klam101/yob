# Everything binds to 127.0.0.1 so nothing is reachable from other machines.
# Ollama is not here: it runs as the native Windows app and containers reach it
# at host.docker.internal:11434.

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        BIN: api
    environment: &backend-env
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
      WEB_ORIGIN: http://localhost:3000
      API_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      # Optional job board keys (see .env.example); blank means skipped.
      USAJOBS_API_KEY: ${USAJOBS_API_KEY:-}
      USAJOBS_EMAIL: ${USAJOBS_EMAIL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ./backend
      args:
        BIN: worker
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        # Called from the browser, so it is the host address, not the service name.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      # Server-side rendering calls the API inside the Docker network.
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
